backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "produkte"
    label: "Produkte"
    folder: "content/produkte"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Preis", name: "price", widget: "string"}
      - {label: "Bild", name: "image", widget: "image"}
      - {label: "Beschreibung", name: "body", widget: "text"}
